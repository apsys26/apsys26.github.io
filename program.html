    .program{
      --text:#111827; --muted:#4d525c; --line:#e5e7eb;
      --navy:#002E60; --paper-bg:#e6edf5;
      --poster:#B5651D; --poster-bg:#f7ead9;
      --timew:104px;
    }

    .program{max-width:1000px;margin:0 auto;padding:0;font:400 16px/1.5 "Helvetica Neue", Helvetica, Arial, sans-serif;color:var(--text)}
    .program h1{font-size:32px;margin:8px 0 12px}

    /* Date bands */
    .p-date{background:var(--navy);color:#fff;text-align:center;font-weight:600;
      letter-spacing:.02em;padding:7px 10px;margin:22px 0 12px;border-radius:4px}
    .p-date:first-child{margin-top:14px}

    /* Sections: unified 2-col grid; a note adds a second row */
    .p-section{
      background:var(--paper-bg);
      border-left:4px solid var(--navy);
      padding:6px 10px;
      margin:8px 0;
      font-weight:600;
      color:var(--navy);

      display:grid;
      grid-template-columns: var(--timew) 1fr;
      column-gap:5px;
      align-items:center;
    }
    .p-section .time{
      font-weight:700;
      display:flex; align-items:center; justify-content:flex-start;
      white-space:nowrap; line-height:1.3;
      padding-right:6px;
      box-sizing:border-box;
    }
    .p-section .titleline{ display:inline-block; }

    /* Poster sessions pick up the site's poster colour */
    .p-section.poster{ background:var(--poster-bg); border-left-color:var(--poster); color:var(--poster); }

    /* Sub-note under the title */
    .p-submeta{ font-size:14px; line-height:1.45; color:var(--muted); font-weight:400; margin-top:3px; }
    .p-section.withmeta{ grid-template-rows:auto auto; }
    .p-section.withmeta .time.vspan{ grid-row:1 / span 2; align-items:flex-start; padding-top:2px; }

    /* Break line between days */
    .p-section.breakline{ background:none; border:none; padding:0; margin:26px 0; display:block; }
    .p-section.breakline hr{ border:0; border-top:1px solid var(--line); margin:0; }

    /* Talks, keynotes and posters share the time column */
    .p-list{
      display:grid;
      grid-template-columns: var(--timew) 1fr;
      gap:6px 14px;
      margin:6px 0;
      align-items:start;
    }
    .p-time{
      font-weight:600; color:#111;
      text-align:left;
      white-space:nowrap; line-height:1.6;
      padding-right:6px;
      box-sizing:border-box;
    }
    .p-talk{padding:2px 0 6px}
    .p-title{font-weight:700;margin:0 0 2px 0}
    .p-title a{color:var(--navy);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
    .p-title a:hover{color:#111}
    .p-auth{color:#374151;margin-top:3px;font-size:15px}
    .p-auth .a-name{font-style:italic; color:#1a56db;}
    .p-auth .a-affil{color:#555}
    .p-meta{color:var(--muted);margin-top:3px;font-size:15px}

    /* Keynote card */
    .p-keynote{border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:#fff;margin:6px 0}

    @media (max-width:620px){
      .program{--timew:84px}
      .program h1{font-size:26px}
      .p-list, .p-section{column-gap:8px}
    }

    /* Print */
    @media print{
      @page{size:A4;margin:10mm}
      body{margin:0}
      .program{padding:0 4mm;font-size:12px}
      .site-nav, #banner{display:none}
      .p-list{break-inside:avoid}
    }
  </style>

const root=document.getElementById('program-root');
const el=(tag,a={},kids=[])=>{const n=document.createElement(tag);for(const[k,v]of Object.entries(a)){if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;else n.setAttribute(k,v);}for(const c of kids){if(typeof c==='string')n.appendChild(document.createTextNode(c));else if(c)n.appendChild(c);}return n;};

function dateBand({text}){return el('div',{class:'p-date',html:text});}

function section({time, title, note, breakline, poster, anchor}){
  if (breakline){
    return el('div',{class:'p-section breakline'},[el('hr')]);
  }
  const attrs = {class:['p-section', poster?'poster':'', note?'withmeta':''].filter(Boolean).join(' ')};
  if (anchor) attrs.id = anchor;

  if (note){
    return el('div',attrs,[
      el('span',{class:'time vspan'},[time || '']),
      el('div',{class:'titleline'},[title]),
      el('div',{class:'p-submeta',html:note})
    ]);
  }
  return el('div',attrs,[
    el('span',{class:'time'},[time || '']),
    el('div',{class:'titleline'},[title])
  ]);
}

function renderAuthors(list){
  const wrap = el('div',{class:'p-auth'});
  (list||[]).forEach((a,i)=>{
    const s = String(a);
    const idx = s.lastIndexOf('(');
    const name = idx>0 ? s.slice(0,idx).trim() : s.trim();
    const aff = (idx>0 && s.endsWith(')')) ? s.slice(idx+1,-1).trim() : '';
    wrap.appendChild(el('span',{class:'author'},[
      el('span',{class:'a-name'},[name]),
      aff? ' ' : '',
      aff? el('span',{class:'a-affil'},['('+aff+')']): null
    ]));
    if(i < list.length-1) wrap.appendChild(document.createTextNode('; '));
  });
  return wrap;
}

function talk({title,authors=[]}){
  return el('div',{class:'p-list'},[
    el('div',{class:'p-time'},['']),
    el('div',{class:'p-talk'},[
      el('div',{class:'p-title'},[title]),
      authors.length? renderAuthors(authors): null
    ])
  ]);
}

function keynote({title,authors=[],href}){
  return el('div',{class:'p-list'},[
    el('div',{class:'p-time'},['']),
    el('div',{class:'p-talk'},[
      el('div',{class:'p-title'},[
        href? el('a',{href:href},[title]) : title
      ]),
      authors.length? renderAuthors(authors): null
    ])
  ]);
}

function posterItem({title,authors=[]}){
  return el('div',{class:'p-list'},[
    el('div',{class:'p-time'},['']),
    el('div',{class:'p-talk'},[
      el('div',{class:'p-title'},[title]),
      authors.length? renderAuthors(authors): null
    ])
  ]);
}

for(const it of SCHEDULE){
  switch(it.type){
    case 'date': root.appendChild(dateBand(it)); break;
    case 'section': root.appendChild(section(it)); break;
    case 'talk': root.appendChild(talk(it)); break;
    case 'keynote': root.appendChild(keynote(it)); break;
    case 'poster': root.appendChild(posterItem(it)); break;
  }
}
